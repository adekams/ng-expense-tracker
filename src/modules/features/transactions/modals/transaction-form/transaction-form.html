<div
  class="fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center z-50"
>
  <div class="bg-white p-6 rounded-lg w-96 relative">
    <button
      (click)="onClose()"
      class="text-4xl absolute top-2 right-2 text-gray-500 hover:text-gray-800"
    >
      &times;
    </button>
    <h2 class="text-xl font-bold mb-4">Add Transaction</h2>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="mb-2">
        <label class="block mb-1"
          >Currency <span class="text-red-500">*</span></label
        >
        <select
          formControlName="currency"
          class="w-full border px-2 py-1 rounded"
        >
          <option value="USD">USD</option>
          <option value="EUR">EUR</option>
          <option value="NGN">NGN</option>
          <option value="GBP">GBP</option>
        </select>
      </div>

      <div class="mb-2">
        <label class="block mb-1">
          Amount
          <span class="text-red-500">*</span>
        </label>
        <input
          formControlName="amount"
          type="number"
          class="w-full border px-2 py-1 rounded"
        />
      </div>

      <div class="mb-2">
        <label class="block mb-1"
          >Category <span class="text-red-500">*</span></label
        >
        <input
          formControlName="category"
          type="text"
          class="w-full border px-2 py-1 rounded"
        />
      </div>

      <div class="mb-2">
        <label class="block mb-1"
          >Date <span class="text-red-500">*</span></label
        >
        <input
          formControlName="date"
          type="date"
          class="w-full border px-2 py-1 rounded"
        />
      </div>

      <div class="mb-2">
        <label class="block mb-1">Description </label>
        <input
          formControlName="description"
          type="text"
          class="w-full border px-2 py-1 rounded"
        />
      </div>

      <button
        type="submit"
        [disabled]="form.invalid"
        class="mt-4 bg-blue-500 disabled:bg-gray-300 disabled:cursor-not-allowed text-white px-4 py-2 rounded hover:bg-blue-600"
      >
        Add
      </button>
    </form>
  </div>
</div>

<div class="p-4">
  <h2 class="text-2xl font-bold mb-4">Transactions</h2>

  <table class="min-w-full table-auto border border-gray-200">
    <thead class="bg-gray-100">
      <tr>
        <th class="px-4 py-2 text-left">Date</th>
        <th class="px-4 py-2 text-left">Category</th>
        <th class="px-4 py-2 text-left">Amount</th>
        <th class="px-4 py-2 text-left">Description</th>
        <th class="px-4 py-2 text-left">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let t of transactions" class="border-t">
        <td class="px-4 py-2">{{ t.date }}</td>
        <td class="px-4 py-2">{{ t.category }}</td>
        <td class="px-4 py-2">{{ t.amount | currency }}</td>
        <td class="px-4 py-2">{{ t.description }}</td>
        <td class="px-4 py-2">
          <button
            (click)="deleteTransaction(t.id)"
            class="text-red-500 hover:text-red-700"
          >
            Delete
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

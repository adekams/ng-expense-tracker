<div class="auth-wrapper">
  <div class="auth-box">
    <h2>Welcome Back</h2>
    <p class="subtitle">Log in to continue</p>

    <form (ngSubmit)="login()">
      <input
        type="email"
        placeholder="Email"
        [(ngModel)]="email"
        name="email"
        required
      />

      <input
        type="password"
        placeholder="Password"
        [(ngModel)]="password"
        name="password"
        required
      />

      <button type="submit" class="btn-primary">Login</button>
    </form>

    <p class="switch-text">
      Don't have an account?
      <a routerLink="./signup" (click)="clicked()">Create one</a>
    </p>
  </div>
</div>
